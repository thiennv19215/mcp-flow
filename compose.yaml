services:
  flow-auth:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FLOW_AUTH_PUBLISH_PORT:-18899}:18900"
    volumes:
      - flow-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18900/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  flow-data:
