<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Flow MCP Connector</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --card: #292929;
      --card-elevated: #2e2e33;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #dedede;
      --text-primary: #f8fafc;
      --text-muted: #8b8b92;
      --text-dim: #65656c;
      
      /* Flow MCP accent theme */
      --primary: #ccff00;
      --primary-hover: #b8e600;
      --primary-fg: #1e1e1e;
      --primary-glow: rgba(204, 255, 0, 0.25);

      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      
      --radius: 8px;
      --radius-sm: 6px;
      --radius-pill: 20px;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      padding: 16px;
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .logo-img img {
      width: 22px;
      height: 22px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--card-elevated);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .lang-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: var(--primary);
      color: var(--primary-fg);
      box-shadow: 0 1px 4px var(--primary-glow);
    }

    /* Status Card */
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .status-badge.connected {
      background: var(--success-bg);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-badge.disconnected {
      background: var(--danger-bg);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .pulse-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.connected .pulse-dot {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      70% { box-shadow: 0 0 0 5px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    .bridge-tag {
      font-size: 11px;
      color: var(--text-dim);
      font-family: ui-monospace, monospace;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
    }

    .info-val {
      font-weight: 600;
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      background: rgba(255, 255, 255, 0.04);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Alert / Error Box */
    .alert-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      display: none;
      align-items: flex-start;
      gap: 7px;
      line-height: 1.4;
    }

    .alert-box.show {
      display: flex;
    }

    .alert-box.warn {
      background: var(--warning-bg);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    .alert-box.error {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Action buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Primary action button */
    .btn-primary {
      background: var(--primary);
      color: var(--primary-fg);
      font-weight: 700;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(204, 255, 0, 0.35);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--card-elevated);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    /* Feedback notice */
    .feedback {
      min-height: 18px;
      font-size: 11.5px;
      text-align: center;
      color: var(--text-muted);
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .feedback.active {
      color: #4ade80;
      font-weight: 500;
    }
  </style>
  <link rel="stylesheet" href="tobyflow-ui.css">
</head>
<body class="flow-mcp-popup">
  <!-- Flow MCP header -->
  <header class="header">
    <div class="brand">
      <div class="logo-img" style="color: var(--primary);">
        <img src="../icons/icon-48.png" alt="" />
      </div>
      <div class="title-wrap">
        <div class="title-row">
          <span class="title">Flow MCP</span>
          <span class="version-badge" id="versionBadge">v0.2.18</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <!-- Language switch -->
      <div class="lang-toggle" title="Ngôn ngữ / Language">
        <button class="lang-btn" id="langVi">VI</button>
        <button class="lang-btn" id="langEn">EN</button>
      </div>

      <!-- Side panel button -->
      <button class="icon-btn" id="openSidebarBtn" title="Mở Side Panel (Thanh bên)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>

      <!-- Settings button -->
      <button class="icon-btn" id="options" title="Cài đặt">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Status Card -->
  <div class="status-card">
    <div class="status-top">
      <span class="status-badge" id="wsBadge">
        <span class="pulse-dot"></span>
        <span id="wsText">Đang kiểm tra…</span>
      </span>
      <span class="bridge-tag" id="bridgeSummary">MCP local · 127.0.0.1:18899</span>
    </div>

    <div class="info-list">
      <div class="info-row">
        <span id="lblFlowTabs">Tab Google Flow:</span>
        <span class="info-val" id="valFlowTabs">0</span>
      </div>
      <div class="info-row">
        <span id="lblSelectedTab">Tab điều khiển:</span>
        <span class="info-val" id="valSelectedTab">Chưa chọn</span>
      </div>
      <div class="info-row">
        <span id="lblBridgeUrl">Địa chỉ máy chủ:</span>
        <span class="info-val" id="valBridgeUrl" style="max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">...</span>
      </div>
    </div>

    <div class="alert-box" id="alertBox">
      <span>⚠️</span>
      <span id="alertText"></span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="openStudioBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
      </svg>
      <span id="txtOpenStudio">Mở Studio (Tạo Ảnh / Video / Nhân Vật)</span>
    </button>

    <button class="btn btn-secondary" id="connect">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span id="txtConnect">Kết nối lại tab Flow</span>
    </button>

    <div class="btn-row">
      <button class="btn btn-secondary" id="preview">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="txtPreview">Xem viền (5s)</span>
      </button>

      <button class="btn btn-secondary" id="openFlowBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span id="txtOpenFlow">Mở Flow</span>
      </button>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>

  <script src="../content/shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
